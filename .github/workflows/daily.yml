name: 每日彩票数据更新与预测

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: daily-lottery
  cancel-in-progress: false

jobs:
  daily-update-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 抓取最新数据
        run: |
          echo "=== 步骤1: 抓取最新数据 ==="
          python3 scripts/update_data.py

      - name: 训练模型
        run: |
          echo "=== 步骤2: 训练 XGBoost + MLP 模型 ==="
          python3 scripts/train_models.py

      - name: 检查上次预测命中情况
        run: |
          echo "=== 步骤3: 检查上次预测是否命中 ==="
          python3 scripts/check_hits.py || true

      - name: 更新动态算法权重
        run: |
          echo "=== 步骤4: 基于历史回测更新算法权重 ==="
          python3 scripts/update_weights.py --backtest 15 || true

      - name: 生成新预测
        run: |
          echo "=== 步骤5: 生成下一期预测 ==="
          python3 scripts/predict.py

      - name: 权重融合预测
        run: |
          echo "=== 步骤6: 用动态权重融合各算法预测 ==="
          python3 scripts/weighted_predict.py || true

      - name: 历史回测验证
        run: |
          echo "=== 步骤6.5: 历史回测验证 ==="
          python3 scripts/backtest.py --n 20 || true

      - name: 生成 README
        run: |
          echo "=== 步骤7: 生成 README ==="
          python3 scripts/generate_readme.py

      - name: 提交并推送
        run: |
          echo "=== 步骤8: 提交并推送 ==="
          git add -A
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日数据更新+预测+权重更新 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
            echo "已推送到 GitHub"
          fi

      - name: 工作流总结
        if: always()
        run: |
          echo "=== 工作流执行总结 ==="
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "权重文件:"
          if [ -f data/algorithm_weights.json ]; then
            echo "  ok data/algorithm_weights.json"
          fi
          echo ""
          echo "权重融合预测:"
          if [ -f data/weighted_predictions.json ]; then
            echo "  ok data/weighted_predictions.json"
          fi
          echo ""
          echo "命中记录:"
          if [ -f data/prediction_hits.json ]; then
            echo "  ok data/prediction_hits.json"
          fi
