name: 每日彩票数据更新与预测

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main
      - master
    paths:
      - 'lottery/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

# 同一时刻只允许一个工作流运行
concurrency:
  group: daily-lottery
  cancel-in-progress: false

jobs:
  daily-update-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 抓取最新数据
        run: |
          echo "=== 步骤1: 抓取最新数据 ==="
          python3 scripts/update_data.py

      - name: 训练模型
        run: |
          echo "=== 步骤2: 训练 XGBoost + MLP 模型 ==="
          python3 scripts/train_models.py

      - name: 检查上次预测命中情况
        run: |
          echo "=== 步骤3: 检查上次预测是否命中 (在新预测生成前) ==="
          python3 scripts/check_hits.py || true

      - name: 生成新预测
        run: |
          echo "=== 步骤4: 生成下一期预测 ==="
          python3 scripts/predict.py

      - name: 生成 README
        run: |
          echo "=== 步骤5: 生成 README ==="
          python3 scripts/generate_readme.py

      - name: 提交并推送
        run: |
          echo "=== 步骤6: 提交并推送 ==="
          git add -A
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日数据更新与预测 $(date -u '+%Y-%m-%d %H:%M:%S UTC')

            - 更新历史数据 CSV
            - 重新训练 XGBoost + MLP 模型
            - 生成下一期预测结果
            - 更新 README"
            git push
            echo "✓ 已推送到 GitHub"
          fi

      - name: 工作流总结
        if: always()
        run: |
          echo "=== 工作流执行总结 ==="
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "预测结果文件:"
          if [ -f data/predictions.json ]; then
            echo "  ✓ data/predictions.json"
          else
            echo "  ✗ data/predictions.json 缺失"
          fi
          echo ""
          echo "训练报告:"
          if [ -f data/training_report.json ]; then
            echo "  ✓ data/training_report.json"
            cat data/training_report.json | python3 -c "import sys,json; data=json.load(sys.stdin); [print(f\"  {r.get('name',r.get('lottery'))}: xgb={r.get('models',{}).get('xgboost',{}).get('success',False)} mlp={r.get('models',{}).get('mlp',{}).get('success',False)}\") for r in data]" 2>/dev/null || true
          fi
          echo ""
          echo "数据更新报告:"
          if [ -f data/update_report.json ]; then
            echo "  ✓ data/update_report.json"
          fi
