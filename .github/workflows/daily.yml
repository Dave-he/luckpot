name: 每日彩票数据更新与预测

on:
  schedule:
    # 北京时间 08:00 / 23:00（开奖后再次刷新）；GitHub 调度可能延迟。
    - cron: '0 0,15 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: daily-lottery
  cancel-in-progress: false

jobs:
  daily-update-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 回归测试
        run: python3 -m unittest discover -s tests -v

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 抓取最新数据
        run: |
          echo "=== 步骤1: 抓取最新数据 ==="
          python3 scripts/update_data.py

      - name: 隔离旧排序预测归档
        run: python3 scripts/migrate_position_archives.py

      - name: 训练模型
        run: |
          echo "=== 步骤2: 训练所有模型 (XGBoost+MLP+RF+Markov+NB+MC+KMeans+LSTM+LotteryAi) ==="
          python3 scripts/train_models.py

      - name: 检查上次预测命中情况
        run: |
          echo "=== 步骤3: 检查上次预测是否命中 ==="
          python3 scripts/check_hits.py

      - name: 更新动态算法权重
        timeout-minutes: 8
        continue-on-error: true
        run: |
          echo "=== 步骤4: 基于历史回测更新算法权重 (含8种ML+传统策略) ==="
          python3 scripts/update_weights.py --backtest 12 --skip-slow

      - name: 生成新预测
        run: |
          echo "=== 步骤5: 生成下一期预测 (所有算法) ==="
          python3 scripts/predict.py

      - name: 权重融合预测
        run: |
          echo "=== 步骤6: 用动态权重融合各算法预测 ==="
          python3 scripts/weighted_predict.py

      - name: 校验本轮数据及预测
        run: python3 scripts/validate_pipeline.py

      - name: 历史回测验证
        timeout-minutes: 8
        continue-on-error: true
        run: |
          echo "=== 步骤6.5: 历史回测验证 ==="
          python3 scripts/backtest.py --n 20 --no-slow

      - name: 归档预测历史
        run: |
          echo "=== 步骤7: 归档预测历史 (结算已开奖 + 记录新预测) ==="
          python3 scripts/update_history.py

      - name: 生成 README
        run: |
          echo "=== 步骤8: 生成 README (下一期预测) ==="
          python3 scripts/generate_readme.py

      - name: 生成预测历史文件
        run: |
          echo "=== 步骤9: 生成 docs/prediction-history.md ==="
          python3 scripts/generate_history.py

      - name: 提交并推送
        run: |
          echo "=== 步骤10: 提交并推送 ==="
          git add -A
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日数据更新+预测+权重更新 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "已推送到 GitHub"
          fi

      - name: 保存本轮报告（含失败现场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-reports-${{ github.run_id }}
          path: |
            data/*report.json
            data/predictions.json
            data/weighted_predictions.json
          retention-days: 14

      - name: 工作流总结
        if: always()
        run: |
          echo "=== 工作流执行总结 ==="
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "权重文件:"
          if [ -f data/algorithm_weights.json ]; then
            echo "  ok data/algorithm_weights.json"
          fi
          echo ""
          echo "权重融合预测:"
          if [ -f data/weighted_predictions.json ]; then
            echo "  ok data/weighted_predictions.json"
          fi
          echo ""
          echo "命中记录:"
          if [ -f data/prediction_hits.json ]; then
            echo "  ok data/prediction_hits.json"
          fi
